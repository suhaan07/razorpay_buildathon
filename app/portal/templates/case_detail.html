{% extends "base.html" %}
{% block title %}{{ case.customer.name }} — {{ case.invoice.invoice_no }}{% endblock %}
{% block content %}
<div class="flex flex-col gap-3">
  <a href="/cases" class="text-xs text-[var(--accent)] hover:underline">&larr; All cases</a>
  <div id="case-card" class="card p-5">
    <div class="text-sm text-[var(--text-muted)]">Loading…</div>
  </div>
</div>

<script>
const caseId = {{ case.id }};
const cardEl = document.getElementById('case-card');

async function load() {
  const resp = await fetch(`/api/cases/${caseId}`);
  const data = await resp.json();
  cardEl.className = '';
  cardEl.innerHTML = buildCaseCardHTML(data);
  wireCaseCardActions(cardEl, caseId, load);
}
load();
</script>
{% endblock %}
