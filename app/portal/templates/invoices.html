{% extends "base.html" %}
{% block title %}Invoices — AI Revenue Recovery{% endblock %}
{% block content %}
<div class="flex flex-col gap-5">
  <h1 class="text-2xl font-display font-extrabold">Invoices</h1>

  <div class="grid sm:grid-cols-2 gap-4">
    <div class="card p-4">
      <h2 class="text-sm font-semibold mb-2">Ingest a sheet</h2>
      <form id="upload-form" class="flex flex-wrap items-center gap-2.5">
        <input type="file" id="file-input" accept=".xlsx" class="text-sm border border-[var(--border)] rounded-lg px-3 py-2 bg-[var(--surface)] file:mr-3 file:border-0 file:bg-[var(--accent-soft)] file:text-[var(--accent)] file:font-semibold file:rounded-md file:px-3 file:py-1.5">
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
      <div id="upload-result" class="text-xs mt-2"></div>
    </div>
    <div class="card p-4">
      <h2 class="text-sm font-semibold mb-2">Run the escalation engine</h2>
      <div class="flex flex-wrap items-center gap-2.5">
        <button id="run-batch" class="btn btn-primary" style="background:var(--success)">Run batch (decide + dispatch)</button>
        <span id="auto-dispatch-status" class="text-xs"></span>
      </div>
      <div id="batch-result" class="text-xs mt-2"></div>
    </div>
  </div>

  <div id="unclassified-banner" class="hidden rounded-lg bg-[var(--warning-soft)] border border-[var(--warning-border)] text-[var(--warning)] text-sm px-4 py-2.5"></div>

  <div id="tabs" class="flex gap-2.5 overflow-x-auto pb-1 -mx-1 px-1"></div>

  <input id="search" type="text" placeholder="Search customer or invoice no…"
    class="w-full sm:w-96 border border-[var(--border)] rounded-lg px-3.5 py-2.5 bg-[var(--surface)] text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-soft)] focus:border-[var(--accent)]">

  <div class="card overflow-x-auto">
    <table class="w-full text-sm min-w-[680px]">
      <thead>
        <tr>
          <th class="p-3 text-left">Customer</th>
          <th class="p-3 text-left">Invoice</th>
          <th class="p-3 text-left">Due Date</th>
          <th class="p-3 text-left">Bucket</th>
          <th class="p-3 text-right">Outstanding</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="count" class="text-xs text-[var(--text-muted)]"></div>
</div>

<script>
const BUCKET_DOT = {
  'All': '#9aa0ad', 'Not Due': '#9aa0ad', '0-15': '#0e8a58', '16-30': '#1d4ed8',
  '31-60': '#a15c00', '61-90': '#c2410c', '90+': '#b3261e',
};
const BUCKET_PILL = {
  'Not Due': 'background:var(--surface-2);color:var(--text-muted)',
  '0-15': 'background:var(--success-soft);color:var(--success)',
  '16-30': 'background:var(--info-soft);color:var(--info)',
  '31-60': 'background:var(--warning-soft);color:var(--warning)',
  '61-90': 'background:#fde3d0;color:#c2410c',
  '90+': 'background:var(--danger-soft);color:var(--danger)',
  'Unclassified': 'background:var(--warning-soft);color:var(--warning)',
};

let activeTab = 'All';
let searchTimer = null;

function tabCard(tab) {
  const active = tab.key === activeTab;
  const dot = BUCKET_DOT[tab.key] || '#9aa0ad';
  return `
    <button data-key="${tab.key}" class="tab-btn text-left shrink-0 rounded-xl border px-4 py-3 min-w-[128px] transition
      ${active ? 'border-[var(--accent)] shadow-sm bg-white ring-1 ring-[var(--accent-soft)]' : 'border-[var(--border)] bg-white hover:border-[var(--text-muted)]'}">
      <div class="flex items-center gap-1.5 text-[11px] text-[var(--text-muted)] mb-1.5 font-medium">
        <span class="w-1.5 h-1.5 rounded-full" style="background:${dot}"></span>${tab.label}
      </div>
      <div class="text-xl font-display font-bold num">${tab.count}</div>
      <div class="text-[11px] text-[var(--text-muted)] num mt-0.5">${tab.total_display}</div>
    </button>`;
}

function rowHtml(r) {
  const pillStyle = BUCKET_PILL[r.bucket] || 'background:var(--surface-2);color:var(--text-muted)';
  const href = r.case_id ? `/cases/${r.case_id}` : null;
  return `
    <tr class="${href ? 'cursor-pointer' : ''} ${r.unclassified ? 'bg-[var(--warning-soft)]/40' : ''}" ${href ? `onclick="window.location='${href}'"` : ''}>
      <td class="p-3">${r.customer}</td>
      <td class="p-3 num">${r.invoice_no}</td>
      <td class="p-3 num">${r.due_date_display}</td>
      <td class="p-3"><span class="pill" style="${pillStyle}">${r.bucket}</span></td>
      <td class="p-3 text-right num">${r.outstanding_display}</td>
    </tr>`;
}

async function load() {
  const q = document.getElementById('search').value.trim();
  const params = new URLSearchParams({ tab: activeTab });
  if (q) params.set('q', q);
  const resp = await fetch('/api/invoices?' + params.toString());
  const data = await resp.json();

  document.getElementById('tabs').innerHTML = data.tabs.map(tabCard).join('');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.key; load(); });
  });

  document.getElementById('rows').innerHTML = data.rows.map(rowHtml).join('') ||
    '<tr><td class="p-6 text-center text-[var(--text-muted)]" colspan="5">No invoices match.</td></tr>';
  document.getElementById('count').textContent = `${data.count} invoice${data.count === 1 ? '' : 's'}`;

  const banner = document.getElementById('unclassified-banner');
  if (data.unclassified_count > 0) {
    banner.textContent = `${data.unclassified_count} invoice(s) have no due date on file and are shown as Unclassified.`;
    banner.classList.remove('hidden');
  } else {
    banner.classList.add('hidden');
  }
}

document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 250);
});

document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('file-input').files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  const el = document.getElementById('upload-result');
  el.textContent = 'Uploading…';
  const resp = await fetch('/upload', { method: 'POST', body: formData });
  const data = await resp.json();
  if (resp.ok) {
    el.innerHTML = `<span class="text-[var(--success)]">Ingested ${data.row_count} rows across ${data.customer_count} customers.</span> ` +
      (data.missing_due_date_count ? `<span class="text-[var(--warning)]">${data.missing_due_date_count} rows missing a due date.</span>` : '');
    load();
  } else {
    el.innerHTML = `<span class="text-[var(--danger)]">${data.detail}</span>`;
  }
});

document.getElementById('run-batch').addEventListener('click', async () => {
  const el = document.getElementById('batch-result');
  el.textContent = 'Running…';
  try {
    const resp = await fetch('/batch/run', { method: 'POST' });
    const text = await resp.text();
    if (!resp.ok) {
      el.innerHTML = `<span class="text-[var(--danger)]">Batch run failed (HTTP ${resp.status}): ${text.slice(0, 500)}</span>`;
      return;
    }
    const data = JSON.parse(text);
    if (data.auto_dispatch_paused) {
      el.innerHTML = `<span class="text-[var(--warning)]">Auto-dispatch is paused — nothing was sent, no links were created. Toggle it on in <a href="/settings" class="underline">Settings</a> if you meant to dispatch for real.</span>`;
      return;
    }
    const failedNote = data.failed ? ` <span class="text-[var(--danger)]">failed=${data.failed} (see a case's timeline for the error)</span>` : '';
    el.innerHTML = `<span class="num">processed=${data.processed} dispatched=${data.dispatched} paused=${data.paused} exhausted=${data.exhausted}</span>${failedNote}`;
    load();
  } catch (err) {
    el.innerHTML = `<span class="text-[var(--danger)]">Request failed: ${err}</span>`;
  }
});

(async () => {
  const resp = await fetch('/api/settings');
  const data = await resp.json();
  const el = document.getElementById('auto-dispatch-status');
  el.innerHTML = data.auto_dispatch_paused
    ? '<span class="text-[var(--warning)]">Auto-dispatch is OFF — Run batch will do nothing until you turn it on in <a href="/settings" class="underline">Settings</a>.</span>'
    : '<span class="text-[var(--danger)]">Auto-dispatch is ON — Run batch will actually send.</span>';
})();

load();
</script>
{% endblock %}
